[package]
name = "zirkio-term"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Zirkio Terminal — terminale veloce per Linux (GTK3, OpenGL, Rust)"
license = "MIT"
publish = false

[dependencies]
# Interfaccia nativa GTK3 (tema di sistema, menu, schede).
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
# Rendering del testo in OpenGL dentro un GtkGLArea.
glow = "0.18"
libloading = "0.8"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
swash = "0.2.10"
toml = "1.1.8"
unicode-width = "0.2.2"
vte = "0.15.0"

# Macchine lente: un solo codegen unit, LTO pieno, binario spogliato.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 1
